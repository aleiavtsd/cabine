<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cabine</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1f5;--panel:#fff;--ink:#14213d;--mut:#5f6b82;--line:#d5dbe6;--acc:#2b4eff;--accInk:#fff;--warn:#c77b00;--ok:#1a7f5a;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--panel:#18223a;--ink:#e8ecf6;--mut:#93a0ba;--line:#2a3757;--acc:#6f8bff;--accInk:#0f1626;--warn:#f0b13a;--ok:#4cc79a}}
:root[data-theme="dark"]{--bg:#0f1626;--panel:#18223a;--ink:#e8ecf6;--mut:#93a0ba;--line:#2a3757;--acc:#6f8bff;--accInk:#0f1626;--warn:#f0b13a;--ok:#4cc79a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.1}
main{max-width:760px;margin:0 auto;padding:20px 16px 80px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.head h1{font-size:clamp(28px,7vw,44px);font-weight:800}
.days{font:700 15px "Bricolage Grotesque";color:var(--mut);text-align:right}
.days b{display:block;font-size:34px;color:var(--ink);line-height:1}
.track{position:relative;display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--panel);margin:8px 0 26px}
.seg{display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:600;color:var(--mut);border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;min-width:0}
.seg.on{background:var(--acc);color:var(--accInk)}
.seg.past{background:color-mix(in srgb,var(--acc) 18%,var(--panel));color:var(--ink)}
.pin{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--warn);border-radius:2px}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--mut)}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:22px;margin-bottom:10px}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input{width:22px;height:22px;margin-top:2px;accent-color:var(--acc);flex:none}
.task.done span{text-decoration:line-through;color:var(--mut)}
.task small{display:block;color:var(--mut)}
.late{color:var(--warn);font-weight:600}
.alert{border-left:4px solid var(--warn)}
.btn{background:var(--acc);color:var(--accInk);border:0;border-radius:8px;padding:10px 16px;font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
label{display:block;font-weight:600;margin:14px 0 4px}
input[type=text],input[type=date],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:64px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.phase h3{font-size:18px;display:flex;justify-content:space-between;gap:8px}
.phase .obj{color:var(--mut);margin:2px 0 6px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.out{border-top:1px solid var(--line);padding:10px 0}
.out b{font-family:"Bricolage Grotesque"}
.muted{color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--mut);margin-left:6px}
.big{font:800 26px "Bricolage Grotesque"}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-top:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}th{color:var(--mut);font-weight:600;border-top:0}
ol.g{padding-left:20px;margin:0}ol.g li{margin:0 0 10px}ol.g b{display:block}.hint{margin:-8px 0 14px}
button.seg{background:var(--panel);border:0;border-right:1px solid var(--line);font-family:inherit;text-align:left;cursor:pointer}button.seg:hover{filter:brightness(.96)}
</style>
</head>
<body>
<main id="app"></main>
<script>
const PH=[
{k:"Antecipação",p:.2,o:"Gerar curiosidade sem falar de oferta.",t:["Definir produto, oferta e bônus","Publicar bastidor da preparação","Mapear as 5 principais objeções","Coletar os primeiros depoimentos"]},
{k:"Captação",p:.3,o:"Levar o público para a lista de espera.",t:["Publicar página/lista de espera","Postar conteúdo com CTA para a lista","Fazer live semanal","Enviar e-mail/WhatsApp para a base"]},
{k:"Aquecimento",p:.35,o:"Aumentar desejo e percepção de valor.",t:["Publicar 3 provas de transformação","Responder objeções em stories","Planejar a live de abertura","Revelar os bônus aos poucos"]},
{k:"Revelação",p:.15,o:"Apresentar a oferta e a data de abertura.",t:["Gravar vídeo da oferta","Preparar mensagens de abertura","Testar checkout e link"]},
{k:"Venda",fix:5,o:"Converter interesse em compra.",t:["Abrir carrinho e avisar a lista","Responder objeções ao vivo","Publicar prova todos os dias","Reforçar urgência e bônus"]},
{k:"Encerramento",fix:1,o:"Última chamada.",t:["Enviar última chamada","Live de encerramento"]},
{k:"Pós-venda",fix:7,o:"Ativar compradores e nutrir os demais.",t:["Onboarding dos compradores","Oferta de entrada para não compradores","Registrar aprendizados"]}];
const DAY=864e5,fmt=d=>new Date(d).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
const todayISO=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
let S={c:null,done:{},provas:[],tab:"hoje",goal:"Quebrar objeção",out:null};
try{const r=localStorage.getItem("cos");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("cos",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function build(c){
 const start=todayISO(),open=new Date(c.date+"T00:00").getTime();
 const pre=Math.max(4,Math.round((open-start)/DAY));let cur=start,phases=[],tasks=[];
 PH.forEach((ph,i)=>{
  const n=ph.fix||Math.max(1,Math.round(pre*ph.p));
  const s=cur,e=cur+n*DAY;cur=e;
  phases.push({k:ph.k,o:ph.o,s,e});
  ph.t.forEach((t,j)=>tasks.push({id:i+"-"+j,ph:i,title:t,due:s+Math.min(n-1,Math.floor(j*n/ph.t.length))*DAY}));
 });
 c.phases=phases;c.tasks=tasks;c.start=start;c.open=open;return c;
}
function curPhase(c,now){const i=c.phases.findIndex(p=>now>=p.s&&now<p.e);return i<0?(now<c.phases[0].s?0:c.phases.length-1):i}

function view(){
 const a=document.getElementById("app");
 if(!S.c){a.innerHTML=onboard();return}
 const c=S.c,now=todayISO(),ci=curPhase(c,now),left=Math.max(0,Math.round((c.open-now)/DAY));
 const total=c.phases[c.phases.length-1].e-c.start,pos=Math.min(100,Math.max(0,(now-c.start)/total*100));
 let h=`<div class="head"><div><div class="muted">${esc(c.name)}</div><h1>${esc(c.product)}</h1></div><div class="days"><b>${left}</b>dias para abrir<br>${fmt(c.open)}</div></div>
 <div class="track" aria-label="Linha do tempo da campanha">${c.phases.map((p,i)=>`<button class="seg ${i<ci?"past":i==ci?"on":""}" style="flex:${(p.e-p.s)/DAY}" data-tab="mapa" title="${p.k}: ver tarefas">${p.k=="Encerramento"?"Fim":p.k}</button>`).join("")}<div class="pin" style="left:${pos}%"></div></div><p class="muted" style="margin:-18px 0 18px;font-size:14px">Toque numa fase para ver as tarefas. A linha laranja marca o dia de hoje.</p>
 <nav role="tablist">${[["hoje","Hoje"],["mapa","Mapa"],["oferta","Oferta"],["numeros","Números"],["provas","Provas"],["conteudo","Conteúdo"],["guia","Guia"]].map(([k,l])=>`<button role="tab" aria-selected="${S.tab==k}" data-tab="${k}">${l}</button>`).join("")}</nav>`;
 h+=HINT[S.tab]?`<p class="muted hint">${HINT[S.tab]}</p>`:"";
 h+={hoje:hoje,mapa:mapa,oferta:oferta,numeros:numeros,provas:provas,conteudo:conteudo,guia:guia}[S.tab](c,now,ci);
 a.innerHTML=h;
}
function onboard(){return `<div class="head"><h1>Cabine</h1></div><div class="card"><h2>Da estratégia à venda, em um só lugar</h2><p>Responda o diagnóstico abaixo, em cerca de 2 minutos. A ferramenta monta a rota, o plano e diz o que fazer hoje. Depois, você registra os números e recebe a próxima melhor ação.</p><p class="muted" style="margin:0">Seus dados ficam só neste navegador. Ninguém vê o que você preencher.</p></div><div class="card"><h2>Diagnóstico da campanha</h2>
<label for="f1">O que você vai vender?</label><input type="text" id="f1" value="Mentoria de vendas no Instagram">
<label for="f2">Para quem?</label><input type="text" id="f2" value="Infoprodutores iniciantes">
<label for="f3">Qual transformação?</label><input type="text" id="f3" value="Sair do zero e vender todo mês">
<label for="f4">Data de abertura do carrinho</label><input type="date" id="f4" value="2026-11-27">
<label for="f5">Nome da campanha</label><input type="text" id="f5" value="Black Friday 2026">
<div class="row"><div><label for="f6">Preço normal (R$)</label><input type="text" inputmode="numeric" id="f6" value="497"></div><div><label for="f7">Meta de faturamento (R$)</label><input type="text" inputmode="numeric" id="f7" value="100000"></div></div>
<div class="row"><div><label for="f8">Investimento máximo (R$)</label><input type="text" inputmode="numeric" id="f8" value="15000"></div><div><label for="f9">Conversão lead → venda (%)</label><input type="text" inputmode="decimal" id="f9" value="2"></div></div>
<div class="row"><div><label for="f10">Sua audiência hoje</label><select id="f10"><option value="fria">Fria</option><option value="morna" selected>Morna</option><option value="quente">Quente</option></select></div><div><label for="f11">O produto já é conhecido?</label><select id="f11"><option value="sim">Sim</option><option value="nao">Não</option></select></div></div>
<p><button class="btn" id="go">Montar campanha</button></p></div>`}

const R=n=>(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
if(S.c)S.c=Object.assign({ticket:497,price:497,meta:100000,budget:15000,conv:2,aud:"morna",known:"sim",real:{leads:0,sales:0,spend:0},sens:{}},S.c);
function calc(c){const v=Math.ceil(c.meta/c.price),cv=c.conv/100;return{v,cpaMax:c.budget/v,leads:Math.ceil(v/cv),cplRef:c.budget/v*cv}}
function real(c){const r=c.real,k=calc(c),cpa=r.sales?r.spend/r.sales:0,cpl=r.leads?r.spend/r.leads:0,cv=r.leads?r.sales/r.leads:0,fat=r.sales*c.price,rc=cv||c.conv/100;
 return{cpa,cpl,cv,fat,proj:fat+Math.max(0,k.leads-r.leads)*rc*c.price,add:Math.max(0,k.v-r.sales)}}
function route(c){const low=c.budget<c.meta*.05,k=c.known=="sim";
 if(low)return{n:"Orçamento enxuto",s:["Orgânico","Lista/WhatsApp","Aquecimento","Oferta","Venda","Mídia só depois"]};
 if(!k&&c.aud=="fria")return{n:"Produto novo, audiência fria",s:["Conteúdo/anúncio","Aula ou evento","Oferta","Venda","Upsell"]};
 if(k&&c.aud=="quente"&&c.budget>=c.meta*.1)return{n:"Base quente com verba",s:["Buzz","Captação","Remarketing","Venda","Escala por CPA"]};
 return{n:"Rota padrão",s:["Buzz","Captação de intenção","Aquecimento","Venda","Upsell"]}}
function diag(c,now,ci){const k=calc(c),r=c.real,x=real(c),el=Math.min(1,Math.max(0,(now-c.start)/Math.max(DAY,c.open-c.start)));
 if(!r.leads&&!r.sales)return["Ainda sem números.","Registre leads, vendas e investimento na aba Números para receber um diagnóstico."];
 if(r.sales&&x.cpa>k.cpaMax)return[`Seu CPA (${R(x.cpa)}) passou do máximo (${R(k.cpaMax)}).`,"Não aumente o investimento. Revise oferta e conversão antes."];
 if(r.leads>=50&&x.cv<c.conv/100*.7)return["Captação funcionando, conversão abaixo do planejado.","Trabalhe a objeção de preço e reforce a prova antes de captar mais."];
 if(r.leads<k.leads*el*.7)return["Captação abaixo do ritmo previsto.","Priorize conteúdo com CTA para a lista nesta semana."];
 if(!S.provas.length)return["Números saudáveis, mas sem provas cadastradas.","Cadastre e publique uma prova de resultado."];
 return["Campanha no ritmo.","Mantenha a cadência e publique a próxima prova."]}
function oferta(c){const sc=[["Desconto",Math.round(c.ticket*.4),"Mesmo produto com preço reduzido."],["Bundle",c.ticket,"Preço cheio com bônus e produto complementar."],["Premium",c.ticket*4,"Produto com acompanhamento e suporte."]],s=c.sens||{};
 const perfil=s.b?"Maior sensibilidade ao preço":s.a?"Maior potencial para ancoragem de valor":"Perfil misto";
 return `<div class="card"><h2>Cenários de oferta</h2><p class="muted">Base ${R(c.ticket)} · meta ${R(c.meta)}. Você escolhe; a ferramenta mostra o impacto.</p>`+sc.map(([n,p,d])=>{const v=Math.ceil(c.meta/p);return `<div class="out"><b>${n}: ${R(p)}</b>${c.price==p?'<span class="tag">em uso</span>':""}<div class="muted">${d}</div><div>${v} vendas · ${Math.ceil(v/(c.conv/100))} leads · CPA máx. ${R(c.budget/v)}</div><div class="muted">${v>300?"Volume alto: exige muita audiência.":v<25?"Poucas vendas: exige prova forte e atendimento próximo.":"Volume viável para uma campanha."}</div><p style="margin:8px 0 0"><button class="btn ghost" data-offer="${p}">Usar esta oferta</button></p></div>`}).join("")+`</div><div class="card"><h2>Sensibilidade a preço</h2>${[["a","O produto gera retorno financeiro direto"],["b","Seu público costuma comparar preços"],["d","Já existem vendas e demanda comprovada"]].map(([k,l])=>`<label class="task" style="margin:0"><input type="checkbox" data-s="${k}" ${s[k]?"checked":""}><span>${l}</span></label>`).join("")}<p><b>${perfil}</b><br><span class="muted">Hipótese a partir das suas respostas, não verdade absoluta.</span></p></div>`}
function numeros(c,now,ci){const k=calc(c),r=c.real,x=real(c),d=diag(c,now,ci);
 return `<div class="card"><h2>Planejado × real</h2><table><tr><th></th><th>Planejado</th><th>Real</th></tr><tr><td>Leads</td><td>${k.leads}</td><td>${r.leads}</td></tr><tr><td>Vendas</td><td>${k.v}</td><td>${r.sales}</td></tr><tr><td>Faturamento</td><td>${R(c.meta)}</td><td>${R(x.fat)}</td></tr><tr><td>Investimento</td><td>${R(c.budget)}</td><td>${R(r.spend)}</td></tr><tr><td>CPA</td><td>${R(k.cpaMax)} máx.</td><td>${R(x.cpa)}</td></tr><tr><td>CPL</td><td>${R(k.cplRef)} ref.</td><td>${R(x.cpl)}</td></tr><tr><td>Conversão</td><td>${c.conv}%</td><td>${(x.cv*100).toFixed(1)}%</td></tr></table>${r.leads||r.sales?`<p>Mantendo a taxa atual, faltam ${x.add} venda(s) para a meta.</p>`:""}</div>
<div class="card"><h2>Registrar números reais</h2><div class="row"><div><label for="r1">Leads</label><input type="text" inputmode="numeric" id="r1" value="${r.leads}"></div><div><label for="r2">Vendas</label><input type="text" inputmode="numeric" id="r2" value="${r.sales}"></div><div><label for="r3">Investimento (R$)</label><input type="text" inputmode="numeric" id="r3" value="${r.spend}"></div></div><p><button class="btn" id="savereal">Atualizar números</button></p></div>
<div class="card alert"><div class="muted">Diagnóstico</div><h2 style="margin:4px 0">${d[0]}</h2>${d[1]}</div>`}
const HINT={hoje:"Comece por aqui todo dia: a ação principal e as 3 tarefas da fase. Marque cada uma ao concluir.",mapa:"A rota e as fases da campanha. Toque nas tarefas para marcar; os prazos foram distribuídos até a abertura.",oferta:"Compare cenários antes de decidir. Ao escolher, meta, vendas e CPA máximo são recalculados.",numeros:"Atualize leads, vendas e investimento toda semana. O diagnóstico só funciona com dados reais.",provas:"Cadastre resultados de clientes e marque quando publicar. Prova parada não vende.",conteudo:"Escolha para quê você precisa da peça. O texto usa produto, público, fase e suas provas.",guia:""};
function guia(){const st=[["Diagnóstico","Responda produto, público, meta, verba e audiência. É a base de tudo."],["Rota","Veja no Mapa o caminho escolhido e confira se faz sentido para o seu caso."],["Oferta","Compare os cenários, escolha um e veja vendas e CPA máximo."],["Execução","Em Hoje, faça as 3 ações e marque como concluído."],["Provas","Cadastre resultados e marque quando usar."],["Conteúdo","Escolha o objetivo da peça e gere post, stories, reel e CTA."],["Números","Registre leads, vendas e investimento toda semana para receber o diagnóstico."]];
 return `<div class="card"><h2>Como usar, passo a passo</h2><ol class="g">${st.map(([a,b])=>`<li><b>${a}</b>${b}</li>`).join("")}</ol></div><div class="card"><h2>Princípios da ferramenta</h2><ol class="g"><li><b>Campanha é sistema, não calendário</b>Estratégia, oferta, execução e números se ligam.</li><li><b>Oferta se constrói</b>Você compara cenários antes de escolher preço.</li><li><b>Prova é ativo reutilizável</b>Cadastre uma vez, use na fase certa.</li><li><b>Poucas ações, as certas</b>Em vez de 37 tarefas, a próxima melhor ação.</li></ol></div><div class="card"><h2>Seus dados</h2><p class="muted">Ficam só neste navegador e neste aparelho. Para outro aparelho, será preciso recomeçar.</p><button class="btn ghost" id="reset">${S.rs?"Toque de novo para apagar tudo":"Começar nova campanha"}</button></div>`}
function hoje(c,now,ci){
 const p=c.phases[ci];
 const pend=c.tasks.filter(t=>t.ph<=ci&&!S.done[t.id]).sort((a,b)=>a.due-b.due);
 const top=pend.slice(0,3);
 const late=pend.filter(t=>t.due<now).length;
 const unused=S.provas.filter(x=>!x.used).length;
 const d=diag(c,now,ci),x=real(c);let h=`<div class="card alert"><div class="muted">Próxima melhor ação</div><h2 style="margin:4px 0">${d[1]}</h2><span class="muted">${d[0]}</span></div><div class="card"><div class="row"><div><div class="muted">Meta</div><div class="big">${R(c.meta)}</div></div><div><div class="muted">Projeção atual</div>${c.real.leads||c.real.sales?`<div class="big">${R(x.proj)}</div>`:`<div class="muted" style="margin-top:6px">Aparece depois que você registrar seus números.</div>`}</div></div><p class="muted" style="margin:8px 0 0">Rota: ${route(c).n}. A projeção estima quanto você fatura se mantiver o ritmo atual.</p></div><div class="card"><h2>${p.k}: próximas 3 ações</h2><p class="muted" style="margin-top:-4px">${p.o}</p>`;
 h+=top.length?top.map(t=>task(t,now)).join(""):`<p>Tudo em dia nesta fase. Vá ao Conteúdo e prepare a próxima.</p>`;
 h+=`</div>`;
 if(late)h+=`<div class="card alert"><b>${late} tarefa(s) atrasada(s).</b> <span class="muted">Reorganize os prazos a partir de hoje.</span><p><button class="btn ghost" id="resched">Reorganizar prazos</button></p></div>`;
 if(unused>=1)h+=`<div class="card alert"><b>${unused} prova(s) cadastrada(s) ainda não usada(s).</b> <span class="muted">Prova parada não vende.</span><p><button class="btn ghost" data-tab="provas">Ver provas</button></p></div>`;
 else if(!S.provas.length&&ci>=1)h+=`<div class="card alert"><b>Nenhuma prova cadastrada.</b> <span class="muted">Você está em ${p.k} e ainda não tem o que mostrar.</span><p><button class="btn ghost" data-tab="provas">Cadastrar prova</button></p></div>`;
 h+=`<p class="muted">Próximo marco: ${c.phases[Math.min(ci+1,6)].k} em ${fmt(c.phases[Math.min(ci+1,6)].s)}.</p>`;
 return h;
}
function task(t,now){const d=S.done[t.id];return `<label class="task ${d?"done":""}" style="margin:0"><input type="checkbox" data-t="${t.id}" ${d?"checked":""}><span>${esc(t.title)}<small class="${t.due<now&&!d?"late":""}">${t.due<now&&!d?"Atrasada · ":""}${fmt(t.due)}</small></span></label>`}
function mapa(c,now,ci){
 const rt=route(c);return `<div class="card"><h2>Rota: ${rt.n}</h2><p class="muted" style="margin:0">${rt.s.join(" → ")}</p></div>`+c.phases.map((p,i)=>{const ts=c.tasks.filter(t=>t.ph==i),n=ts.filter(t=>S.done[t.id]).length;
 return `<div class="card phase"><h3><span>${p.k}${i==ci?'<span class="tag">agora</span>':""}</span><span class="muted" style="font:500 14px 'Instrument Sans'">${fmt(p.s)} a ${fmt(p.e-DAY)}</span></h3><div class="obj">${p.o}</div><div class="bar"><i style="width:${n/ts.length*100}%"></i></div>${ts.map(t=>task(t,now)).join("")}</div>`}).join("");
}
function provas(){
 return `<div class="card"><h2>Nova prova</h2><div class="row"><div><label for="p1">Cliente</label><input type="text" id="p1"></div><div><label for="p3">Categoria</label><select id="p3"><option>Resultado financeiro</option><option>Transformação</option><option>Antes e depois</option><option>Depoimento</option><option>Caso de uso</option></select></div></div>
 <label for="p2">Resultado</label><input type="text" id="p2" placeholder="Ex.: R$ 12 mil em vendas em 30 dias"><p><button class="btn" id="addp">Salvar prova</button></p></div>
 <div class="card"><h2>Banco de provas</h2>${S.provas.length?S.provas.map((x,i)=>`<label class="task" style="margin:0"><input type="checkbox" data-p="${i}" ${x.used?"checked":""}><span>${esc(x.who)}: ${esc(x.res)}<small>${esc(x.cat)} · ${x.used?"já usada":"ainda não usada"}</small></span></label>`).join(""):`<p class="muted">Cadastre seu primeiro resultado. Marque como usada depois de publicar.</p>`}</div>`;
}
function conteudo(c,now,ci){
 const g=["Buzz","Atrair","Aquecer","Provar","Quebrar objeção","Vender","Urgência"];
 let h=`<div class="card"><h2>O que você precisa agora?</h2><div class="chips">${g.map(x=>`<button class="chip" aria-pressed="${S.goal==x}" data-goal="${x}">${x}</button>`).join("")}</div>`;
 if(S.goal=="Quebrar objeção")h+=`<label for="obj">Qual objeção?</label><input type="text" id="obj" value="${esc(S.obj||"Não tenho tempo")}">`;
 h+=`<p class="muted">Fase atual: ${c.phases[ci].k}. Produto e público vêm da campanha.</p><button class="btn" id="gen">Gerar peças</button></div>`;
 if(S.out)h+=`<div class="card">${S.out.map(([k,v])=>`<div class="out"><b>${k}</b><div>${esc(v)}</div></div>`).join("")}</div>`;
 return h;
}
function gen(){
 const c=S.c,pr=c.product,pu=c.audience,tr=c.transform,ph=c.phases[curPhase(c,todayISO())].k,g=S.goal,o=S.obj||"Não tenho tempo";
 const pv=S.provas[0];const prova=pv?`${pv.who}: ${pv.res}`:"[insira uma prova aqui]";
 const M={
 "Buzz":[["Post",`Algo grande vem aí para ${pu}. Ainda não posso contar tudo.`],["Stories","Contagem regressiva + pergunta: o que você mais quer resolver?"],["Reel","Gancho: “Vou fazer algo que nunca fiz.” Sem revelar a oferta."],["CTA","Ative o lembrete."]],
 "Urgência":[["Post",`Últimas horas de ${pr}. Depois, volta ao preço de ${R(c.ticket)}.`],["WhatsApp",`Oi! Fecha hoje a condição de ${R(c.price)} de ${pr}. Ficou alguma dúvida?`],["Stories","Contagem regressiva + 1 prova + link."],["CTA","Entre antes que feche."]],
 "Atrair":[["Post",`Se você é ${pu}, provavelmente já tentou de tudo. O que ninguém conta sobre ${tr.toLowerCase()}.`],["Stories","3 telas: erro comum, o que fazer no lugar, convite para a lista."],["Reel","Gancho: “Pare de fazer isso se quer ${tr.toLowerCase()}”. 20s, sem enrolação."],["CTA","Entre na lista e receba primeiro."]],
 "Aquecer":[["Post",`Bastidor de ${pr}: o que estamos preparando e por que faz diferença para ${pu}.`],["Stories","Enquete: “qual sua maior trava hoje?”. Responda 3 respostas em vídeo."],["Live",`Tema: o caminho para ${tr.toLowerCase()} em 30 dias.`],["CTA","Responda este story para receber o material."]],
 "Provar":[["Post",`Caso real — ${prova}. O que essa pessoa fez diferente.`],["Stories","Print do resultado + 1 frase do cliente + convite para ver mais."],["Reel","Antes, virada, depois. Legenda com o número do resultado."],["CTA","Quer o mesmo caminho? Entre na lista."]],
 "Vender":[["Post",`${pr} está aberto até ${fmt(c.phases[5].s)}. Veja o que você leva e para quem é.`],["WhatsApp",`Oi! O carrinho de ${pr} abriu. Posso te explicar rapidinho se faz sentido para você?`],["Live","Roteiro: promessa, prova, oferta, bônus, garantia, perguntas."],["CTA","Garanta sua vaga hoje."]],
 "Quebrar objeção":[["Post",`“${o}.” Entendo. Veja como ${pu} chegou em ${tr.toLowerCase()} mesmo pensando assim.`],["Stories",`Sequência: 1) a frase “${o}” 2) por que ela parece verdade 3) ${prova} 4) convite.`],["Reel",`Gancho: “Se você pensa ‘${o.toLowerCase()}’, assista isso.”`],["Argumento WhatsApp",`Sobre “${o.toLowerCase()}”: foi exatamente o que ${pv?pv.who:"nossos alunos"} me disse antes de começar.`],["Ponto para live",`Dedique 5 minutos à objeção “${o}” com um caso real.`],["CTA","Tire sua dúvida comigo por aqui."]]};
 S.out=M[g];
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.id!="reset")S.rs=0;
 if(b.id=="go"){const v=id=>document.getElementById(id).value.trim();
  const n=id=>Number(v(id).replace(/[^\d]/g,""))||1;S.c=build({product:v("f1"),audience:v("f2"),transform:v("f3"),date:v("f4")||"2026-11-27",name:v("f5"),ticket:n("f6"),price:n("f6"),meta:n("f7"),budget:n("f8"),conv:parseFloat(v("f9").replace(",","."))||2,aud:v("f10"),known:v("f11"),real:{leads:0,sales:0,spend:0},sens:{}});S.done={};S.tab="hoje"}
 else if(b.dataset.tab)S.tab=b.dataset.tab;
 else if(b.dataset.goal){const o=document.getElementById("obj");if(o)S.obj=o.value;S.goal=b.dataset.goal;S.out=null}
 else if(b.id=="gen"){const o=document.getElementById("obj");if(o)S.obj=o.value;gen()}
 else if(b.id=="addp"){const w=document.getElementById("p1").value.trim(),r=document.getElementById("p2").value.trim();if(!w||!r)return;S.provas.push({who:w,res:r,cat:document.getElementById("p3").value,used:false})}
 else if(b.id=="resched"){const now=todayISO();S.c.tasks.filter(t=>!S.done[t.id]&&t.due<now).forEach((t,i)=>t.due=now+Math.floor(i/2)*DAY)}
 else if(b.dataset.offer){S.c.price=+b.dataset.offer}
 else if(b.id=="savereal"){const n=id=>Number(document.getElementById(id).value.replace(/[^\d]/g,""))||0;S.c.real={leads:n("r1"),sales:n("r2"),spend:n("r3")}}
 else if(b.id=="reset"){if(S.rs){S.c=null;S.done={};S.provas=[];S.out=null;S.rs=0}else S.rs=1}
 else return;
 save();view();
});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.t)S.done[t.dataset.t]=t.checked;
 else if(t.dataset.p)S.provas[+t.dataset.p].used=t.checked;
 else if(t.dataset.s)S.c.sens[t.dataset.s]=t.checked;else return;
 save();view();
});
view();
</script>
</body>
</html>
